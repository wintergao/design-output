  <title id="chart-title">Chatbot Architecture by Business Scenario</title>
  <desc id="chart-desc">Two business scenarios: Agent Assistant on the left and Customer Assistant on the right. Touchpoints are separate from GenAI Hub 2.0, whose left-side group contains Chatbot, Agent Platform, and Ontology / Knowledge. Each scenario has a dedicated Assistant Agent, its own domain agents, and its own knowledge scope. Skill Market and Tools Library are shared across both scenarios.</desc>
