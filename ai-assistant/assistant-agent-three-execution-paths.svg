<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="2000" viewBox="0 0 4200 2000" version="1.1" role="img" aria-labelledby="diagram-title diagram-description" font-family="Arial, Helvetica, sans-serif">
  <title id="diagram-title">Assistant Agent — Three Execution Paths</title>
  <desc id="diagram-description">A transparent 4200 by 2000 diagram. The original reference robot icon is reused without changes to its geometry or colors. The Assistant Agent is centered in the upper row, with User Request on its left and Response to User on its right. Below are three equal cards: Knowledge Retrieval &amp; Answering, Data Delegation &amp; Analysis, and Business Delegation &amp; Orchestration. The Assistant selects or combines paths as needed. Requests go to the selected paths and their results return to the Assistant for a consolidated response. Knowledge Base is accessed directly; data analysis is delegated to Chat BI / Data Agent; business requests are delegated to and coordinated across Domain Agents. There is no prescribed sequence between the three paths. The Assistant icon and text sit directly on the transparent canvas with no backing panel. All three execution cards use the same #DC416A header fill, white title text, #F6CFDA borders, and white content areas with black text. In this compact revision, each lower card is 1000 units high instead of 1268, the three step centers are 120 units apart instead of 198, and the result areas are raised by 268 units. The complete composition is centered vertically on the unchanged 4200 by 2000 transparent canvas. All visible wording, type sizes, colors, and the original Agent icon remain unchanged.</desc>
