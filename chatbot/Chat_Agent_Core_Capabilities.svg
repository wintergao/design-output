        <path d="M11.6 14.5h8.8v7h-8.8zM13.3 14.5v-2.2a2.7 2.7 0 0 1 5.4 0v2.2"/>
      </g>
      <text x="1551" y="519.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-privacy">Privacy &amp; Fine-Grained Access</text>
      <text x="1551" y="559.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-privacy">Minimize personal data and verify access to each record and field.</text>
    </g>
    <g id="entry-tool">
      <path d="M1478 600.0 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="643.25" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 653.75) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
