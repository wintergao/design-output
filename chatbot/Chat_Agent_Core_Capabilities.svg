    <text x="1200" y="742" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="43" font-weight="700" fill="#30495C" text-anchor="middle" id="center-heading">Chat Agent</text>
    <path d="M1200 766 V796 Q1200 810 1215 810 H1436" stroke="#62557D" stroke-width="4.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
