    </g>
    <g id="entry-policy">
      <path d="M1478 741.5 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="784.75" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 795.25) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 4.5h13l5.5 5.4V14m-5.6-9.5v6h5.6M5 4.5v23h10M9 14h6.2M9 18h4.5"/>
        <path d="M24 15.5c1.8 1.3 3.6 1.9 5.4 2.2v4c0 3.2-2.1 5.6-5.4 7.4-3.3-1.8-5.4-4.2-5.4-7.4v-4a13.5 13.5 0 0 0 5.4-2.2zm-2.6 6.8 1.8 1.8 3.5-3.8"/>
      </g>
      <text x="1551" y="802.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-policy">Scenario-Based Output Controls</text>
      <text x="1551" y="842.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-policy">Enforce sourcing, wording, disclosure and review rules before display.</text>
    </g>
    <g id="entry-recover">
      <path d="M1478 883.0 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="926.25" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 936.75) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.7 12.8a11.4 11.4 0 1 1-.2 7.5M4.6 5.5v7.7H12"/>
        <path d="M15.5 9.8v7.1l5 2.8"/>
      </g>
      <text x="1551" y="928.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-recover">Resilience &amp; Recovery</text>
      <text x="1551" y="968.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-recover">
        <tspan x="1551" y="968.84">Resume interrupted tasks and recover</tspan>
        <tspan x="1551" y="999.84">safely without duplicate submissions.</tspan>
      </text>
    </g>
    <g id="entry-audit">
      <path d="M1478 1024.5 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="1067.75" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 1078.25) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 3h15l5.2 5.2v5M18.5 3v6h5.7M4 3v26h13M8 11.5h7.2M8 16.2h5M8 21h3.5"/>
        <path d="M21.4 14.5a6.4 6.4 0 1 0 .1 12.8 6.4 6.4 0 0 0-.1-12.8zm4.8 11.1 4.3 4.2"/>
