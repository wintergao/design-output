        <path d="M7 11c2.2-.2 3.5.2 5 1.1M7 15.9c2.2-.2 3.5.2 5 1.1m7.8-.9 2.1 2.2 4.3-5.2"/>
      </g>
      <text x="142" y="496.01666666666665" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="31" font-weight="700" fill="#333D47" text-anchor="start" id="heading-knowledge">Answer from Approved Knowledge</text>
      <text x="142" y="537.1666666666666" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="25" font-weight="400" fill="#333D47" text-anchor="start" id="copy-knowledge">Use relevant FAQs and cite the applicable policy or document.</text>
    </g>
