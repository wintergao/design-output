      </g>
      <text x="142" y="307.35" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="31" font-weight="700" fill="#333D47" text-anchor="start" id="heading-dialogue">Manage Multi-turn Dialogue</text>
      <text x="142" y="348.5" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="25" font-weight="400" fill="#333D47" text-anchor="start" id="copy-dialogue">Clarify requests and carry context across follow-up questions.</text>
    </g>
    <g id="entry-knowledge">
      <path d="M62 411.3333333333333 H922" stroke="#A2C1D3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="57" y="474.66666666666663" width="62" height="62" rx="14" fill="#EAF4F8" stroke="none" stroke-width="1.2"/>
      <g transform="translate(71.0 488.66666666666663) scale(1.0625)" fill="none" stroke="#365F78" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
