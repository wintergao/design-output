<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="2100" viewBox="0 0 2400 1200" version="1.1" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Chat Agent core capabilities</title>
  <desc id="art-desc">The Chat Agent icon is centred. The upper arrow points left to its six functional capabilities, and the lower arrow points right to eight technical capabilities.</desc>
  <g id="functional-list">
    <rect x="33" y="34" width="918" height="1132" rx="21" fill="#C7DDEA" stroke="#A2C1D3" stroke-width="1.6"/>
    <g id="entry-intent">
