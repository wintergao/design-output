      </g>
      <text x="1551" y="79.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-isolation">Instance &amp; Session Isolation</text>
      <text x="1551" y="119.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-isolation">
        <tspan x="1551" y="119.84">Isolate each bot’s configuration and</tspan>
        <tspan x="1551" y="150.84">each user’s context, memory and tasks.</tspan>
      </text>
    </g>
    <g id="entry-capacity">
      <path d="M1478 175.5 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="218.75" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 229.25) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 17.5h17.5v4H3zM3 25h17.5v4H3zM3 10h10v4H3zM21 15l7-9m-6.5 0H28v6.5"/>
        <path d="M6.5 19.5h1m-1 7.5h1"/>
      </g>
      <text x="1551" y="236.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-capacity">Concurrency &amp; Capacity Isolation</text>
      <text x="1551" y="276.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-capacity">Scale across replicas and protect each instance’s capacity under load.</text>
    </g>
    <g id="entry-latency">
      <path d="M1478 317.0 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="360.25" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 370.75) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 3a12.5 12.5 0 1 1-12 16M4 10h8M2 14h7m7-8V4m8.7 7.7 1.6-1M16 16l5.8-7.2M14.4 16a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0z"/>
      </g>
      <text x="1551" y="362.325" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-latency">Latency-Aware Orchestration</text>
      <text x="1551" y="402.84" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-latency">
        <tspan x="1551" y="402.84">Use the shortest valid path and budget</tspan>
        <tspan x="1551" y="433.84">time for models, tools and checks.</tspan>
      </text>
    </g>
    <g id="entry-privacy">
      <path d="M1478 458.5 H2338" stroke="#B8B4CC" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1473" y="501.75" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
