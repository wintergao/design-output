      <g transform="translate(71.0 111.33333333333331) scale(1.0625)" fill="none" stroke="#365F78" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.5 4.5a10 10 0 1 0 8.9 5.5M13.5 9a5.5 5.5 0 1 0 5 4"/>
        <path d="M13.5 14.5 23 5m0-3v5h5M21.8 22.5l6 6"/>
      </g>
      <text x="142" y="118.68333333333331" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="31" font-weight="700" fill="#333D47" text-anchor="start" id="heading-intent">Understand Intent &amp; Context</text>
      <text x="142" y="159.83333333333331" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="25" font-weight="400" fill="#333D47" text-anchor="start" id="copy-intent">Identify the customer’s goal, constraints and current task.</text>
    </g>
    <g id="entry-dialogue">
