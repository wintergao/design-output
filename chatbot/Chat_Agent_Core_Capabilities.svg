        <path d="M10.5 15.5h3.3a3.5 3.5 0 0 0 3.5-3.5V9.8a3.5 3.5 0 0 1 3.5-3.5h1.6M13.8 15.5a3.5 3.5 0 0 1 3.5 3.5v3.2a3.5 3.5 0 0 0 3.5 3.5h1.6"/>
      </g>
      <text x="142" y="684.6833333333334" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="31" font-weight="700" fill="#333D47" text-anchor="start" id="heading-route">Route &amp; Coordinate Tasks</text>
      <text x="142" y="725.8333333333334" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="25" font-weight="400" fill="#333D47" text-anchor="start" id="copy-route">Select the right skill or domain agent and coordinate the work.</text>
    </g>
    <g id="entry-results">
      <path d="M62 788.6666666666666 H922" stroke="#A2C1D3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="57" y="852.0" width="62" height="62" rx="14" fill="#EAF4F8" stroke="none" stroke-width="1.2"/>
      <g transform="translate(71.0 866.0) scale(1.0625)" fill="none" stroke="#365F78" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5h13l5.5 5.5v18.5H6zM18.8 3.5v6h5.5M9.8 13h7.9m-8.1 5 2 1.9 3.8-4.3"/>
        <path d="M18.5 22h11m-4.3-4.2 4.3 4.2-4.3 4.2"/>
