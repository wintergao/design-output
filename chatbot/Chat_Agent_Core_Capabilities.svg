      <text x="1551" y="1069.825" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="29.5" font-weight="700" fill="#333D47" text-anchor="start" id="heading-audit">Observability &amp; Auditability</text>
      <text x="1551" y="1110.34" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.5" font-weight="400" fill="#333D47" text-anchor="start" id="copy-audit">
        <tspan x="1551" y="1110.34">Trace what the customer saw to its</tspan>
        <tspan x="1551" y="1141.34">sources, checks and business receipt.</tspan>
      </text>
    </g>
  </g>
