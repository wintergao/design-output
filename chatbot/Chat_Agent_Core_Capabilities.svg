        <path d="M13 28h14m-4-4 4 4-4 3"/>
      </g>
      <text x="142" y="1062.0166666666664" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="31" font-weight="700" fill="#333D47" text-anchor="start" id="heading-handoff">Handle Exceptions &amp; Handoffs</text>
      <text x="142" y="1103.1666666666665" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="25" font-weight="400" fill="#333D47" text-anchor="start" id="copy-handoff">Recognize when help is needed and brief the human representative.</text>
    </g>
  </g>
  <g id="technical-list">
    <rect x="1449" y="34" width="918" height="1132" rx="21" fill="#D2D1E4" stroke="#B8B4CC" stroke-width="1.6"/>
    <g id="entry-isolation">
      <rect x="1473" y="77.25" width="55" height="55" rx="14" fill="#F1EFF7" stroke="none" stroke-width="1.2"/>
      <g transform="translate(1483.5 87.75) scale(1.0625)" fill="none" stroke="#61567E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 6H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h9m5-20h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-8M16.5 3v26"/>
