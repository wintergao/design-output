<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="2100" viewBox="0 0 1680 840" role="img" aria-labelledby="title desc">
<title id="title">A2UI and AG-UI in a chatbot</title><desc id="desc">From left to right: Chat UI, Chatbot, Agent. A2UI specifies UI components, data, and user actions. AG-UI carries run inputs and streams agent events. The chatbot can forward A2UI content from an AG-UI event to the chat window for rendering.</desc>
