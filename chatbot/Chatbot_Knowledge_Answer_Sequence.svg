<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4300" height="2000" viewBox="0 0 4300 2000" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Customer Assistant — Knowledge Answer Sequence</title>
<desc id="diagram-description">Six participants: Customer, Chatbot, Agent, Skill, MCP, KB. Fourteen numbered cross-participant messages. A bounded clarification loop refines customer intent, followed by approved knowledge retrieval and an answer with sources. Transparent canvas and editable text. Skill is a logical workflow execution boundary.</desc>
<defs>
<marker id="ink-call" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="14" refY="8.5" orient="auto">
<path d="M1 1 L14 8.5 L1 16 Z" fill="#253347"/>
</marker>
<marker id="ink-return" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="14" refY="8.5" orient="auto">
<path d="M1 1 L14 8.5 L1 16" fill="none" stroke="#253347" stroke-width="2.6"/>
</marker>
<marker id="blue-call" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="14" refY="8.5" orient="auto">
