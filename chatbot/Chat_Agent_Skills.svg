    <text x="466" y="663.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">1</text>
    <text x="494" y="664.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Match the customer’s intent to the configured routing rules.</text>
    <circle cx="466" cy="701.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="707.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">2</text>
    <text x="494" y="708.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Select an eligible channel and check its sign-in requirements.</text>
    <circle cx="466" cy="745.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="751.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">3</text>
    <text x="494" y="752.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Return the entry point and explain why it fits, so the customer can choose.</text>
  </g>
