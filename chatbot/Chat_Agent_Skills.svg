    <text x="452" y="968.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.4" font-weight="400" fill="#333D47" text-anchor="start">When an in-scope request remains unresolved and meets the rules for live support.</text>
    <path d="M452 988.0H1584" stroke="#C3D6E1" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="1015.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17.6" font-weight="700" fill="#416A80" text-anchor="start">WORKFLOW</text>
    <circle cx="466" cy="1047.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="1053.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">1</text>
    <text x="494" y="1054.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Capture the customer’s goal, steps already taken and unresolved issue.</text>
    <circle cx="466" cy="1091.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="1097.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">2</text>
    <text x="494" y="1098.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Prepare a redacted summary and a reference to the authorized conversation history.</text>
    <circle cx="466" cy="1135.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="1141.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">3</text>
    <text x="494" y="1142.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Return the handoff request with the escalation reason and suggested queue.</text>
  </g>
