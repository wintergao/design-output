  <title id="svgtitle">Chat Agent and its three reusable skills</title>
  <desc id="svgdesc">The Chat Agent can retrieve evidence from an approved knowledge base, recommend an entry point across four digital channels, or prepare a context package for D365 Live Agent. The dashed channel arrow denotes recommendation.</desc>
