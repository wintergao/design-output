    <text x="529" y="494.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="22" font-weight="400" fill="#426276" text-anchor="start">resolve_service_destination</text>
    <path d="M427 513.0H1609" stroke="#ADC7D5" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="543.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17.6" font-weight="700" fill="#416A80" text-anchor="start">WHEN TO USE</text>
    <text x="452" y="578.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.4" font-weight="400" fill="#333D47" text-anchor="start">When the customer wants to complete a service or explore a product and needs the right channel.</text>
    <path d="M452 598.0H1584" stroke="#C3D6E1" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="625.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17.6" font-weight="700" fill="#416A80" text-anchor="start">WORKFLOW</text>
