    <text x="528" y="75.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="36" font-weight="700" fill="#333D47" text-anchor="start">Answer from Approved Knowledge</text>
    <text x="529" y="104.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="22" font-weight="400" fill="#426276" text-anchor="start">answer_from_approved_knowledge</text>
    <path d="M427 123.0H1609" stroke="#ADC7D5" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="153.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17.6" font-weight="700" fill="#416A80" text-anchor="start">WHEN TO USE</text>
    <text x="452" y="188.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.4" font-weight="400" fill="#333D47" text-anchor="start">When the customer asks a question covered by approved FAQs or knowledge articles.</text>
    <path d="M452 208.0H1584" stroke="#C3D6E1" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="235.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="17.6" font-weight="700" fill="#416A80" text-anchor="start">WORKFLOW</text>
    <circle cx="466" cy="267.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="273.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">1</text>
    <text x="494" y="274.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Search approved content using the question and conversation context.</text>
    <circle cx="466" cy="311.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="317.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">2</text>
    <text x="494" y="318.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Check that the source applies to the customer’s product and market.</text>
    <circle cx="466" cy="355.0" r="13.8" fill="#C5DBE8"/>
    <text x="466" y="361.8" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="18.2" font-weight="700" fill="#416A80" text-anchor="middle">3</text>
    <text x="494" y="362.0" font-family="Arial, Helvetica, Nimbus Sans, sans-serif" font-size="24.3" font-weight="400" fill="#333D47" text-anchor="start">Return an answer with sources, or flag missing or conflicting evidence.</text>
  </g>
