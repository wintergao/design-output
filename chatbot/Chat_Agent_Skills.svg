  <g id="skill-knowledge">
    <rect x="426" y="27.0" width="1184" height="366" rx="18" fill="#E8F2F7" stroke="#ADC7D5" stroke-width="1.6"/>
    <path d="M426.8 123.0V45.0Q426.8 27.8 444 27.8H1592Q1609.2 27.8 1609.2 45.0V123.0Z" fill="#C7DDEA"/>
    <rect x="446" y="44.0" width="63" height="62" rx="12" fill="#EFF6FA" stroke="none" stroke-width="1.7"/>
